name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - name: Install
        run: |
          pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-dev.txt
      - name: Lint
        run: cd backend && ruff check .
      - name: Schema contract up to date
        run: python scripts/export_schemas.py --check
      - name: Tests (unit + integration)
        env: { MLFLOW_DISABLE_AGENT_HINT: "1" }
        run: cd backend && python -m pytest
      - name: Training pipeline smoke (synthetic data, tiny CNN)
        env: { MLFLOW_DISABLE_AGENT_HINT: "1" }
        run: |
          cd backend
          python -m training.synthetic --model-id lip_dryness --out /tmp/syn --subjects 30 --per-subject 4
          python -m training.train --model-id lip_dryness --manifest /tmp/syn/manifest.csv --backbone small_cnn --epochs 1 \
            --input-size 64 --out-dir /tmp/models --runs-dir /tmp/runs --tracker json
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t health-mirror-backend .
